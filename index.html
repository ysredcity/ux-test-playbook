<dialog id="rules-dialog" class="wide-dialog" aria-labelledby="rules-title"><div class="dialog-head"><div><p>公司非归档设计规范</p><h2 id="rules-title">24 个专业判断要点</h2></div><button data-close aria-label="关闭规范索引">×</button></div><div class="dialog-body"><label class="search-label" for="rule-search">查找规范要点</label><input id="rule-search" type="search" placeholder="搜索按钮、表单、审批、反馈…"><p id="rule-count" role="status"></p><div id="rule-list"></div></div></dialog>
<dialog id="source-dialog" class="wide-dialog" aria-labelledby="source-title"><div class="dialog-head"><h2 id="source-title">依据与原始资料</h2><button data-close aria-label="关闭来源">×</button></div><div class="dialog-body" id="source-body"></div></dialog>
<dialog id="demo-dialog" class="wide-dialog" aria-labelledby="demo-title"><div class="dialog-head"><h2 id="demo-title">复杂表单的校验反馈</h2><button data-close aria-label="关闭演示">×</button></div><div class="dialog-body"><div class="form-study" x-data="{mode:'clear',tried:false,reason:'',city:''}"><div class="mini-form"><div class="switch-line"><b>出差申请</b><span>交互演示</span></div><label for="city-demo">目的地</label><input id="city-demo" x-model="city" placeholder="填写城市" :aria-invalid="tried&&!city" aria-describedby="city-error"><p class="field-error" id="city-error" x-show="tried&&!city">请填写目的地</p><label for="reason-demo">出差事由</label><input id="reason-demo" x-model="reason" placeholder="填写本次出差目的" :aria-invalid="tried&&!reason" aria-describedby="reason-error"><p class="field-error" id="reason-error" x-show="tried&&!reason">请填写出差事由</p><button class="solid" @click="tried=true" :disabled="mode==='dim'&&(!city||!reason)">检查表单</button><p class="form-result" x-show="tried&&city&&reason" role="status">必填项完整，可以继续。</p></div><div class="form-explanation"><div class="segmented" role="group" aria-label="表单反馈方式"><button @click="mode='dim';tried=false" :aria-pressed="mode==='dim'">直接置灰</button><button @click="mode='clear';tried=false" :aria-pressed="mode==='clear'">允许定位错误</button></div><h3>防错与可推进性，<br>需要同时成立。</h3><p>复杂表单中，允许触发校验，可以告诉用户缺少什么、在哪里补充。</p><p>提交失败时一次性展示错误，定位首个错误字段，保留已填内容。</p><button class="text-button" @click="city='';reason='';tried=false">重置演示 ↺</button></div></div></div></dialog>
<noscript><div class="no-script">演示需要启用 JavaScript。你也可以<a href="reader.html">阅读完整提纲</a>。</div></noscript>
